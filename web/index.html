<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox</title>
<style>
  :root {
    --bg: #11131a;
    --panel: #171a21;
    --panel2: #1d212a;
    --line: #272c37;
    --fg: #eef0f3;
    --muted: #818a9c;
    --accent: #5b8def;
    --ok: #3ddc84;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* icon button, shared */
  .ibtn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex: none; transition: border-color .15s ease, color .15s ease;
  }
  .ibtn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .ibtn:hover { border-color: var(--accent); color: var(--fg); }
  .ibtn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .ibtn.ok { border-color: var(--ok); color: var(--ok); }

  /* header */
  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 14px; }
  .brand svg { width: 17px; height: 17px; stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  header .spacer { flex: 1; }
  header .tools { display: flex; gap: 6px; }

  /* password gate */
  .gate { max-width: 300px; margin: 18vh auto; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
  .gate input {
    width: 100%; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--fg);
    font-size: 14px; outline: none; transition: border-color .15s ease;
  }
  .gate input:focus { border-color: var(--accent); }
  .gate button {
    padding: 11px; border-radius: 10px; border: none;
    background: var(--accent); color: #0b0d12; font-weight: 600;
    font-size: 14px; cursor: pointer;
  }
  .gate .err { color: var(--danger); font-size: 12.5px; min-height: 16px; text-align: center; }

  /* layout */
  main { padding: 16px; }
  .columns {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 760px) {
    .columns { grid-template-columns: 1fr; }
  }
  .col-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin-bottom: 10px; padding: 0 2px;
  }
  .col-head .n { color: var(--fg); background: var(--panel2); border-radius: 999px; padding: 1px 8px; font-size: 11px; }
  .col-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 10px; border: 1px dashed var(--line); border-radius: 12px; }

  /* cards */
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden;
  }
  .card .meta {
    display: flex; align-items: center; gap: 7px; padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .card .meta .src { font-size: 12px; color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .card .meta .time { font-size: 11.5px; color: var(--muted); }
  .card .meta .spacer { flex: 1; }
  .card .meta .acts { display: flex; gap: 4px; }
  .card .meta .ibtn { width: 26px; height: 26px; border-radius: 6px; }
  .card .meta .ibtn svg { width: 13px; height: 13px; }

  .imgbox { background: var(--panel2); display: flex; align-items: center; justify-content: center; min-height: 80px; max-height: 320px; overflow: hidden; }
  .imgbox img { width: 100%; max-height: 320px; object-fit: contain; display: block; }
  .imgbox .broken { color: var(--muted); font-size: 12.5px; padding: 24px; text-align: center; }
  .imgbox .broken a { color: var(--accent); }

  .textbox {
    padding: 10px 12px; font: 13px/1.5 ui-monospace, "SF Mono", monospace;
    white-space: pre-wrap; word-break: break-word; color: var(--fg);
    max-height: 120px; overflow: hidden; position: relative; cursor: pointer;
  }
  .textbox.expanded { max-height: none; cursor: default; }
  .textbox:not(.expanded)::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 36px;
    background: linear-gradient(to bottom, transparent, var(--panel));
  }

  a { color: var(--accent); }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="enter">Unlock</button>
    <div id="gateErr" class="err"></div>
  </div>

  <div id="app" hidden>
    <header>
      <div class="brand">
        <svg viewBox="0 0 24 24"><path d="M3 7l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        Inbox
      </div>
      <div class="status"><span id="dot" class="dot"></span><span id="count">0</span></div>
      <div class="spacer"></div>
      <div class="tools">
        <button id="refresh" class="ibtn" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
        </button>
        <button id="delAll" class="ibtn danger" title="Delete all">
          <svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </button>
        <button id="lock" class="ibtn" title="Lock">
          <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
      </div>
    </header>
    <main>
      <div class="columns">
        <section>
          <div class="col-head">Images <span class="n" id="imgCount">0</span></div>
          <div id="imgList"></div>
          <div class="col-empty" id="imgEmpty">No images yet</div>
        </section>
        <section>
          <div class="col-head">Text <span class="n" id="textCount">0</span></div>
          <div id="textList"></div>
          <div class="col-empty" id="textEmpty">No text yet</div>
        </section>
      </div>
    </main>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = null;
let timer = null;
const seenImg = new Set();
const seenText = new Set();

const ICON_COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

function esc(s) { return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function domain(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url || "unknown"; }
}

function relTime(iso) {
  const d = new Date(iso);
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 45) return "now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  if (s < 604800) return Math.floor(s / 86400) + "d";
  return d.toLocaleDateString();
}

async function copyText(txt, btn) {
  try { await navigator.clipboard.writeText(txt); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  flashOk(btn);
}

async function copyImage(src, btn) {
  try {
    const blob = await (await fetch(src)).blob();
    await navigator.clipboard.write([new ClipboardItem({ [blob.type || "image/png"]: blob })]);
    flashOk(btn);
  } catch (e) {
    copyText(src, btn);
  }
}

function flashOk(btn) {
  const old = btn.innerHTML;
  btn.innerHTML = ICON_CHECK;
  btn.classList.add("ok");
  setTimeout(() => { btn.innerHTML = old; btn.classList.remove("ok"); }, 1100);
}

function metaRow(item) {
  const row = document.createElement("div");
  row.className = "meta";
  const site = esc(item.site_title || domain(item.site_url));
  const full = esc(`${item.site_title || ""}\n${item.site_url || ""}`.trim());
  row.innerHTML = `
    <span class="src" title="${full}">${domain(item.site_url)}</span>
    <span class="time" title="${esc(new Date(item.created_at).toLocaleString())}">${relTime(item.created_at)}</span>
    <span class="spacer"></span>
    <span class="acts"></span>`;
  return row;
}

function renderImage(item) {
  const card = document.createElement("div");
  card.className = "card";
  const row = metaRow(item);
  const acts = row.querySelector(".acts");

  const copyBtn = document.createElement("button");
  copyBtn.className = "ibtn"; copyBtn.title = "Copy image"; copyBtn.innerHTML = ICON_COPY;
  copyBtn.onclick = () => copyImage(item.content, copyBtn);

  const delBtn = document.createElement("button");
  delBtn.className = "ibtn danger"; delBtn.title = "Delete"; delBtn.innerHTML = ICON_TRASH;
  delBtn.onclick = () => delOne(item.id, card, "image");

  acts.append(copyBtn, delBtn);
  card.appendChild(row);

  const box = document.createElement("div");
  box.className = "imgbox";
  const img = document.createElement("img");
  img.loading = "lazy";
  img.src = item.content;
  img.onerror = () => {
    box.innerHTML = `<div class="broken">Image unavailable. <a href="${esc(item.site_url)}" target="_blank">Open source</a></div>`;
  };
  box.appendChild(img);
  card.appendChild(box);
  return card;
}

function renderText(item) {
  const card = document.createElement("div");
  card.className = "card";
  const row = metaRow(item);
  const acts = row.querySelector(".acts");

  const copyBtn = document.createElement("button");
  copyBtn.className = "ibtn"; copyBtn.title = "Copy text"; copyBtn.innerHTML = ICON_COPY;
  copyBtn.onclick = (e) => { e.stopPropagation(); copyText(item.content, copyBtn); };

  const delBtn = document.createElement("button");
  delBtn.className = "ibtn danger"; delBtn.title = "Delete"; delBtn.innerHTML = ICON_TRASH;
  delBtn.onclick = (e) => { e.stopPropagation(); delOne(item.id, card, "text"); };

  acts.append(copyBtn, delBtn);
  card.appendChild(row);

  const box = document.createElement("div");
  box.className = "textbox";
  box.textContent = item.content;
  box.title = "Click to expand";
  box.onclick = () => box.classList.toggle("expanded");
  card.appendChild(box);
  return card;
}

async function load() {
  if (!TOKEN) return;
  $("dot").classList.remove("live");
  try {
    const r = await fetch("/api/list?limit=150&token=" + encodeURIComponent(TOKEN));
    if (r.status === 401) { doLock("Session expired. Enter password again."); return; }
    const { items } = await r.json();

    const imgs = items.filter((i) => i.kind === "image");
    const texts = items.filter((i) => i.kind === "text");

    const freshImg = imgs.filter((i) => !seenImg.has(i.id));
    const freshText = texts.filter((i) => !seenText.has(i.id));
    for (const i of freshImg) seenImg.add(i.id);
    for (const i of freshText) seenText.add(i.id);

    if (freshImg.length) {
      $("imgList").innerHTML = "";
      for (const i of imgs) $("imgList").appendChild(renderImage(i));
    }
    if (freshText.length) {
      $("textList").innerHTML = "";
      for (const i of texts) $("textList").appendChild(renderText(i));
    }

    $("count").textContent = items.length;
    $("imgCount").textContent = imgs.length;
    $("textCount").textContent = texts.length;
    $("imgEmpty").hidden = imgs.length > 0;
    $("textEmpty").hidden = texts.length > 0;
    $("dot").classList.add("live");
  } catch (e) {
    // transient, keep previous view
  }
}

function startAuto() { stopAuto(); timer = setInterval(load, 4000); }
function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }

function openApp(token) {
  TOKEN = token;
  try { localStorage.setItem("cap_token", token); } catch {}
  $("gate").hidden = true; $("app").hidden = false;
  seenImg.clear(); seenText.clear();
  $("imgList").innerHTML = ""; $("textList").innerHTML = "";
  load(); startAuto();
}

function doUnlock() {
  const pw = $("pw").value;
  if (!pw) { $("gateErr").textContent = "Enter the password."; return; }
  fetch("/api/auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: pw }),
  }).then(async (r) => {
    if (r.ok) {
      const { token } = await r.json();
      openApp(token);
    } else {
      $("gateErr").textContent = "Wrong password.";
    }
  }).catch(() => { $("gateErr").textContent = "Network error."; });
}

function restoreWithToken(token) {
  fetch("/api/list?limit=1&token=" + encodeURIComponent(token)).then((r) => {
    if (r.ok) openApp(token);
    else { try { localStorage.removeItem("cap_token"); } catch {} }
  }).catch(() => {});
}

function doLock(msg) {
  stopAuto(); TOKEN = null;
  try { localStorage.removeItem("cap_token"); } catch {}
  $("app").hidden = true; $("gate").hidden = false;
  $("pw").value = ""; $("gateErr").textContent = msg || "";
}

async function delOne(id, card, kind) {
  if (!TOKEN) return;
  try {
    const r = await fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-app-token": TOKEN },
      body: JSON.stringify({ id }),
    });
    if (r.ok) {
      if (kind === "image") { seenImg.delete(id); $("imgCount").textContent = Math.max(0, +$("imgCount").textContent - 1); $("imgEmpty").hidden = +$("imgCount").textContent > 0; }
      else { seenText.delete(id); $("textCount").textContent = Math.max(0, +$("textCount").textContent - 1); $("textEmpty").hidden = +$("textCount").textContent > 0; }
      if (card) card.remove();
      $("count").textContent = Math.max(0, (parseInt($("count").textContent, 10) || 1) - 1);
    }
  } catch (e) {}
}

async function delAll() {
  if (!TOKEN) return;
  if (!confirm("Delete all captured items? This cannot be undone.")) return;
  try {
    const r = await fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-app-token": TOKEN },
      body: JSON.stringify({ all: true }),
    });
    if (r.ok) {
      seenImg.clear(); seenText.clear();
      $("imgList").innerHTML = ""; $("textList").innerHTML = "";
      $("count").textContent = "0"; $("imgCount").textContent = "0"; $("textCount").textContent = "0";
      $("imgEmpty").hidden = false; $("textEmpty").hidden = false;
    }
  } catch (e) {}
}

$("delAll").onclick = delAll;
$("enter").onclick = doUnlock;
$("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doUnlock(); });
$("refresh").onclick = load;
$("lock").onclick = () => doLock("");

(function () {
  let saved = null;
  try { saved = localStorage.getItem("cap_token"); } catch {}
  if (saved) restoreWithToken(saved);
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #14161b;
    --panel: #1c1f26;
    --line: #2b2f38;
    --fg: #eef0f3;
    --muted: #7d8495;
    --on: #3ddc84;
    --on-dim: #1f6b42;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 180px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    padding: 22px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* password gate */
  #gate { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  #pw {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
    font-size: 13px;
    outline: none;
    transition: border-color .15s ease;
  }
  #pw:focus { border-color: var(--accent); }
  #pw::placeholder { color: var(--muted); }
  #unlock {
    padding: 9px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0b0d12;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: filter .15s ease;
  }
  #unlock:hover { filter: brightness(1.08); }
  #unlock:active { filter: brightness(0.94); }
  #gerr {
    color: #ff6b6b;
    font-size: 11px;
    min-height: 13px;
    text-align: center;
  }

  /* power button */
  #power {
    position: relative;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: none;
    background: var(--panel);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px var(--line);
    transition: box-shadow .2s ease, background .2s ease;
  }
  #power svg {
    width: 30px;
    height: 30px;
    stroke: var(--muted);
    stroke-width: 2;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke .2s ease;
  }
  #power.on {
    background: radial-gradient(circle at 50% 42%, rgba(61,220,132,.16), transparent 70%), var(--panel);
    box-shadow:
      inset 0 0 0 1.5px var(--on-dim),
      0 0 0 6px rgba(61,220,132,.08),
      0 0 18px rgba(61,220,132,.25);
  }
  #power.on svg { stroke: var(--on); }
  #power:active { transform: scale(0.96); }

  #state {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color .2s ease;
  }
  #state.on { color: var(--on); }
</style>
</head>
<body>
  <div class="wrap">
    <div id="gate" hidden>
      <input type="password" id="pw" placeholder="Password" autocomplete="off">
      <button id="unlock">Unlock</button>
      <div id="gerr"></div>
    </div>

    <div id="toggleWrap" hidden style="display:flex; flex-direction:column; align-items:center; gap:10px;">
      <button id="power" aria-label="Toggle capture">
        <svg viewBox="0 0 24 24"><path d="M12 2v8"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>
      </button>
      <span id="state">off</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg:#0f1115; --fg:#e6e8ec; --line:#2a2f3a; --panel:#1e222b; --on:#58d68d; }
    * { box-sizing:border-box; }
    body { margin:0; width:210px; background:var(--bg); color:var(--fg);
      font:14px system-ui,-apple-system,sans-serif; }
    .wrap { padding:24px; min-height:104px; display:flex; align-items:center; justify-content:center; }

    /* password gate */
    #gate { display:flex; flex-direction:column; gap:10px; width:100%; }
    #pw { width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
      background:var(--panel); color:var(--fg); outline:none; }
    #pw:focus { border-color:#6ea8fe; }
    #unlock { padding:10px; border-radius:10px; border:none; background:#6ea8fe;
      color:#0b0d12; font-weight:650; cursor:pointer; }
    #gerr { color:#ff6b6b; font-size:12px; min-height:14px; text-align:center; }

    /* on/off switch */
    .switch { position:relative; width:92px; height:48px; cursor:pointer; }
    .switch input { position:absolute; opacity:0; width:0; height:0; }
    .track { position:absolute; inset:0; background:#3a3f4b; border-radius:999px; transition:background .2s ease; }
    .knob { position:absolute; top:5px; left:5px; width:38px; height:38px; border-radius:50%;
      background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.45); transition:left .2s ease; }
    .switch input:checked ~ .track { background:var(--on); }
    .switch input:checked ~ .knob { left:49px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="gate" hidden>
      <input type="password" id="pw" placeholder="Password" autocomplete="off">
      <button id="unlock">Unlock</button>
      <div id="gerr"></div>
    </div>

    <label id="toggleWrap" class="switch" hidden>
      <input type="checkbox" id="toggle">
      <span class="track"></span>
      <span class="knob"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
